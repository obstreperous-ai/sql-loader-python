version: '3'

vars:
  VENV_DIR: .venv
  PYTHON: "{{.VENV_DIR}}/bin/python"
  PIP: "{{.VENV_DIR}}/bin/pip"
  PYTEST: "{{.VENV_DIR}}/bin/pytest"

tasks:
  venv:
    desc: "Create virtual environment and install dependencies"
    cmds:
      - python3 -m venv {{.VENV_DIR}}
      - "{{.PIP}} install --upgrade pip"
      - "{{.PIP}} install -e '.[dev]'"
    sources:
      - pyproject.toml
    generates:
      - "{{.VENV_DIR}}/bin/activate"

  test:
    desc: "Run tests with pytest"
    deps: [venv]
    cmds:
      - "{{.PYTEST}}"

  test-cov:
    desc: "Run tests with coverage report"
    deps: [venv]
    cmds:
      - "{{.PYTEST}} --cov=sql_loader --cov-report=html --cov-report=term"

  format:
    desc: "Format code with black and isort"
    deps: [venv]
    cmds:
      - "{{.VENV_DIR}}/bin/black src tests"
      - "{{.VENV_DIR}}/bin/isort src tests"

  lint:
    desc: "Lint code with ruff"
    deps: [venv]
    cmds:
      - "{{.VENV_DIR}}/bin/ruff check src tests"

  typecheck:
    desc: "Type check with mypy"
    deps: [venv]
    cmds:
      - "{{.VENV_DIR}}/bin/mypy src"

  package:
    desc: "Build binary with PyInstaller"
    deps: [venv]
    cmds:
      - "{{.VENV_DIR}}/bin/pyinstaller --onefile --name sql-loader src/sql_loader/cli.py"
    generates:
      - dist/sql-loader

  wheel:
    desc: "Build wheel distribution"
    deps: [venv]
    cmds:
      - "{{.PYTHON}} -m build"
    generates:
      - dist/*.whl

  clean:
    desc: "Clean build artifacts"
    cmds:
      - rm -rf build dist *.egg-info .pytest_cache .coverage htmlcov .mypy_cache .ruff_cache
      - find . -type d -name __pycache__ -exec rm -rf {} +

  clean-all:
    desc: "Clean everything including venv"
    deps: [clean]
    cmds:
      - rm -rf {{.VENV_DIR}}
