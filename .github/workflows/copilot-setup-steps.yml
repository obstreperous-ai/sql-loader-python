name: "Copilot Setup Steps"

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip
      
      - name: Install project dependencies
        run: |
          # Install core dependencies (versions will be pinned in pyproject.toml when created)
          pip install click sqlalchemy
          
          # Install testing framework
          pip install pytest pytest-cov
          
          # Install code quality tools
          pip install black isort ruff mypy
          
          # Install build tools
          pip install build
      
      - name: Install project in development mode (if pyproject.toml exists)
        run: |
          if [ -f "pyproject.toml" ]; then
            pip install -e .
          fi
      
      - name: Display installed packages
        run: |
          pip list
      
      - name: Verify environment setup
        run: |
          # Verify Python packages can be imported
          python -c "import click, sqlalchemy, pytest, black, isort, ruff, mypy" && echo "✓ All Python packages verified"
          
          # Verify CLI tools are available
          pytest --version
          black --version
          isort --version
          ruff --version
          mypy --version
          
          echo "✓ Environment setup complete and verified"
